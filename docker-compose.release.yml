# ─────────────────────────────────────────────────────────────────────────────
#  Portfolio Manager — release stack
#  Commit as:  Trading_Dashboard_App/docker-compose.release.yml
#
#  This is what install.sh downloads onto a user's machine as
#  docker-compose.yml. It pulls prebuilt images and never compiles anything, so
#  a Raspberry Pi goes from nothing to running in about a minute instead of
#  several minutes — and needs no swap, no Node, no Python, no Git, and no
#  clone of either repository.
#
#  Folder it creates alongside itself:
#
#      portfolio-manager/
#      ├── docker-compose.yml
#      ├── .env                # TZ, UID, GID, port — no secrets
#      ├── data/               # the shared diode: bridge writes, dashboard reads
#      └── bridge-state/       # .env, credentials.env, token.json, inboxes
#
#  Why data/ is mounted at /app/data in BOTH services: when you save your keys
#  on the Settings page, the dashboard writes APP_DATA_DIR into the bridge's
#  .env using the path the DASHBOARD container sees. The bridge must find that
#  same folder at that same absolute path. It looks redundant; it is not.
# ─────────────────────────────────────────────────────────────────────────────

name: portfolio-manager

services:
  dashboard:
    image: ghcr.io/justintimefordinner-lang/portfolio-dashboard:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    environment:
      # Where the app deposits credentials and reauth requests.
      AM_REPORT_BRIDGE_DIR: /bridge-state
      NODE_ENV: production
      TZ: ${TZ:-America/Denver}
    volumes:
      - ./data:/app/data
      - ./bridge-state:/bridge-state
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  bridge:
    image: ghcr.io/justintimefordinner-lang/portfolio-bridge:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      TZ: ${TZ:-America/Denver}
      PYTHONUNBUFFERED: "1"
    volumes:
      # Persistent working-directory state. /state IS the bridge's working
      # directory inside the container, so .env, credentials.env, token.json,
      # .auth_state.json, reauth_inbox/ and task_inbox/ are real files here.
      - ./bridge-state:/state
      # Same absolute path the dashboard uses. See the note at the top.
      - ./data:/app/data

# No port is published for the bridge, and none is needed. The Schwab login is
# a paste flow — reauth.py calls auth.client_from_received_url() on a URL you
# copy out of your browser — so nothing ever listens on 127.0.0.1:8182.

  # Applies updates requested from Settings → "Update now". A stock Docker CLI
  # with the host's Docker socket, so it can pull and recreate THIS project's
  # containers; it is told the project name and never touches anything else.
  # It has to run as root for the socket, which is the same trust as any Docker
  # management tool. It does nothing until the dashboard drops
  # data/update-request, and reports back through data/update-status.json.
  updater:
    image: docker:28-cli
    restart: unless-stopped
    environment:
      COMPOSE_PROJECT_NAME: portfolio-manager
    # The install folder at the SAME path as on the host, so the compose file's
    # relative mounts (./data, ./bridge-state) resolve to the host folders when
    # compose runs from inside this container. install.sh writes STACK_DIR.
    working_dir: ${STACK_DIR:-/stack}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${STACK_DIR:-/stack}:${STACK_DIR:-/stack}
    entrypoint: ["sh", "-c"]
    command:
      - |
        marker=data/update-request; status=data/update-status.json
        report() { printf '{"status":"%s","message":%s,"updatedAt":"%s"}\n' "$$1" "$$2" "$$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$$status.tmp" && mv "$$status.tmp" "$$status"; }
        echo "updater: watching $$(pwd)/$$marker"
        while true; do
          if [ -f "$$marker" ]; then
            rm -f "$$marker"
            echo "updater: update requested"
            report running null
            # Every service except this one: recreating the updater from inside itself
            # would kill this very command part-way through.
            others=$$(docker compose config --services 2>/dev/null | grep -v "^updater$$" | tr "\n" " ")
            if out=$$(docker compose pull $$others 2>&1) && out2=$$(docker compose up -d --no-deps $$others 2>&1); then
              report done null
              echo "updater: done"
            else
              msg=$$(printf '%s\n%s' "$$out" "$$out2" | tail -n 3 | tr -d '"\' | tr '\n' ' ')
              report error "\"$$msg\""
              echo "updater: FAILED: $$msg"
            fi
          fi
          sleep 10
        done
